version: 2

# Raw tables are Iceberg tables in the `raw` namespace, created from the CSVs
# in the MinIO `landing` bucket by the `stage_raw_sources` macro
# (runs automatically as an on-run-start hook; see macros/stage_raw_sources.sql).
#
# Per table:
#   meta.landing_path  - folder of CSVs to load (defaults to s3a://landing/<table>/)
#   meta.csv_options   - Spark CSV reader options, merged over the defaults
#                        header=true, inferSchema=true, nullValue=''

sources:
  - name: raw
    schema: raw
    tables:
      - name: customers
        description: "Customer data loaded from CSV"
        meta:
          landing_path: s3a://landing/customers/
          csv_options:
            dateFormat: 'yyyy-MM-dd'

      - name: accounts
        description: "Account data loaded from CSV"
        meta:
          landing_path: s3a://landing/accounts/
          csv_options:
            dateFormat: 'yyyy-MM-dd'

      - name: branches
        description: "Branch data loaded from CSV"
        meta:
          landing_path: s3a://landing/branches/

      - name: cards
        description: "Card data loaded from CSV"
        meta:
          landing_path: s3a://landing/cards/
          csv_options:
            dateFormat: 'yyyy-MM-dd'

      - name: loans
        description: "Loan data loaded from CSV"
        meta:
          landing_path: s3a://landing/loans/
          csv_options:
            dateFormat: 'yyyy-MM-dd'

      - name: merchants
        description: "Merchant data loaded from CSV"
        meta:
          landing_path: s3a://landing/merchants/

      - name: transactions
        description: "Transaction data loaded from CSV"
        meta:
          landing_path: s3a://landing/transactions/
          csv_options:
            dateFormat: 'yyyy-MM-dd'
