lakehouse:
  target: dev
  outputs:
    dev:
      type: spark
      method: thrift
      host: "{{ env_var('SPARK_THRIFT_HOST', 'spark-thrift') }}"
      port: "{{ env_var('SPARK_THRIFT_PORT', '10000') | as_number }}"
      user: hive
      auth: NONE

      # Iceberg catalog, MinIO and extensions are configured server-side in
      # spark/base/conf/spark-defaults.conf (spark.sql.defaultCatalog=lakehouse),
      # so unqualified schemas here are Iceberg namespaces.
      schema: staging
      threads: 4

      connect_timeout: 60
      connect_retries: 5
