############################################
# Spark Core
############################################
spark.sql.extensions org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# Unqualified table names (everything dbt creates) go to the Iceberg
# REST catalog instead of the session catalog.
spark.sql.defaultCatalog lakehouse

############################################
# Iceberg Catalog (REST)
############################################
spark.sql.catalog.lakehouse org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lakehouse.type rest
spark.sql.catalog.lakehouse.uri http://iceberg-rest:8181
spark.sql.catalog.lakehouse.warehouse s3://warehouse

############################################
# Iceberg IO (MinIO via S3FileIO)
# S3FileIO uses the AWS SDK directly and ignores the fs.s3a.* settings
# below, so it needs its own endpoint/credentials or it will call real AWS.
############################################
spark.sql.catalog.lakehouse.io-impl org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lakehouse.s3.endpoint http://minio:9000
spark.sql.catalog.lakehouse.s3.path-style-access true
spark.sql.catalog.lakehouse.s3.access-key-id minio
spark.sql.catalog.lakehouse.s3.secret-access-key minio123
spark.sql.catalog.lakehouse.client.region us-east-1

############################################
# S3 / MinIO (Hadoop S3A) - used to read the raw CSVs
############################################
spark.hadoop.fs.s3a.endpoint http://minio:9000
spark.hadoop.fs.s3a.path.style.access true
spark.hadoop.fs.s3a.connection.ssl.enabled false
spark.hadoop.fs.s3a.endpoint.region us-east-1
spark.hadoop.fs.s3a.access.key minio
spark.hadoop.fs.s3a.secret.key minio123
spark.hadoop.fs.s3a.aws.credentials.provider org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
# Let s3:// paths work too (Hadoop only maps s3a:// by default)
spark.hadoop.fs.s3.impl org.apache.hadoop.fs.s3a.S3AFileSystem

############################################
# Spark event logging (optional but useful)
############################################
spark.eventLog.enabled true
spark.eventLog.dir file:/tmp/spark-events

############################################
# Performance defaults (baseline safe)
############################################
spark.sql.shuffle.partitions 8
spark.default.parallelism 8

############################################
# Thrift / JDBC friendliness
############################################
spark.sql.hive.thriftServer.singleSession false
