name: teratai-ducklake

# Minimal lakehouse:
#   ceph      single-node Ceph exposing CephFS  -> where the lake's Parquet files + landing CSVs live
#   postgres  Airflow metadata DB + DuckLake catalog DB
#   airflow   Airflow 3 (standalone) + astronomer-cosmos + dbt v2 (dbt-oss) running DuckDB in-process;
#             mounts CephFS at /lakehouse with ceph-fuse

x-ceph-net: &ceph_ip ${CEPH_MON_IP:-172.29.10.10}

networks:
  lakehouse-net:
    driver: bridge
    ipam:
      config:
        - subnet: ${LAKEHOUSE_SUBNET:-172.29.10.0/24}

volumes:
  ceph-etc:
  ceph-data:
  ceph-client:
  postgres-data:

services:
  # -----------------------------
  # Ceph (mon + mgr + osd + mds) -> CephFS
  # -----------------------------
  ceph:
    build: ./ceph
    image: teratai/ceph-aio:local
    container_name: teratai-ceph
    hostname: ceph
    environment:
      MON_IP: *ceph_ip
      PUBLIC_NETWORK: ${LAKEHOUSE_SUBNET:-172.29.10.0/24}
      CEPHFS_NAME: lakehouse
      CEPHFS_CLIENT: lakehouse
      OSD_SIZE_GB: ${CEPH_OSD_SIZE_GB:-20}
    volumes:
      - ceph-etc:/etc/ceph
      - ceph-data:/var/lib/ceph
      - ceph-client:/ceph-client
    networks:
      lakehouse-net:
        ipv4_address: *ceph_ip
    restart: unless-stopped

  # -----------------------------
  # Postgres (Airflow metadata + DuckLake catalog)
  # -----------------------------
  postgres:
    image: postgres:17
    container_name: teratai-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lakehouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lakehouse}
      POSTGRES_DB: airflow
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - lakehouse-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lakehouse} -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # -----------------------------
  # Airflow 3 + Cosmos + dbt v2 + DuckDB
  # -----------------------------
  airflow:
    build: ./airflow
    image: teratai/airflow-ducklake:local
    container_name: teratai-airflow
    # Starts as root only to mount CephFS; the entrypoint then drops to the `airflow` user.
    user: "0:0"
    # ceph-fuse needs the FUSE device + CAP_SYS_ADMIN inside the container.
    devices:
      - /dev/fuse:/dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
      - label:disable   # SELinux hosts (Fedora/RHEL): allow the FUSE mount
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-lakehouse}:${POSTGRES_PASSWORD:-lakehouse}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"   # local dev: no login
      AIRFLOW__CORE__PARALLELISM: "8"
      AIRFLOW__COSMOS__ENABLE_TELEMETRY: "false"
      # CephFS mount
      CEPHFS_CLIENT: lakehouse
      LAKEHOUSE_ROOT: /lakehouse
      # DuckLake catalog connection. DuckDB's postgres extension (libpq) reads these PG* vars,
      # so catalogs.yml only needs "postgres:dbname=ducklake" and holds no credentials.
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-lakehouse}
      PGPASSWORD: ${POSTGRES_PASSWORD:-lakehouse}
      DUCKLAKE_DATA_PATH: /lakehouse/lake/
      LANDING_PATH: /lakehouse/landing
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    volumes:
      - ceph-client:/ceph-client:ro
      - ./airflow/dags:/opt/airflow/dags
      - ./dbt:/opt/airflow/dbt
    networks:
      - lakehouse-net
    depends_on:
      ceph:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v2/monitor/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    restart: unless-stopped
