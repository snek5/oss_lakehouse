networks:
  lakehouse-net:
    driver: bridge

volumes:
  postgres-data:
  minio-data:
  spark-events:

# All Spark services share one image, built from spark/base.
x-spark-build: &spark-build
  image: spark-base:latest
  build:
    context: ./spark/base
    dockerfile: Dockerfile

services:

  # -----------------------------
  # PostgreSQL (Iceberg catalog)
  # -----------------------------
  postgres:
    image: postgres:15
    container_name: lakehouse-postgres
    environment:
      POSTGRES_USER: iceberg
      POSTGRES_PASSWORD: iceberg
      POSTGRES_DB: iceberg_catalog
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - lakehouse-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iceberg -d iceberg_catalog"]
      interval: 10s
      timeout: 5s
      retries: 10

  # -----------------------------
  # MinIO (S3 storage)
  # -----------------------------
  minio:
    image: minio/minio:latest
    container_name: lakehouse-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - lakehouse-net
    healthcheck:
      # Recent MinIO images no longer ship curl; mc is always present.
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # -----------------------------
  # MinIO bucket bootstrap
  #   warehouse -> Iceberg table data (managed by the REST catalog)
  #   landing   -> raw CSV drops, one folder per source table
  # Anything in ./data/landing is mirrored into the landing bucket.
  # -----------------------------
  minio-init:
    image: minio/mc:latest
    container_name: lakehouse-minio-init
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./data/landing:/seed:ro
    entrypoint: >
      /bin/sh -c "
      set -e;
      mc alias set local http://minio:9000 minio minio123;
      mc mb -p local/warehouse;
      mc mb -p local/landing;
      mc mirror --overwrite --exclude '*.md' --exclude '.gitkeep' /seed local/landing;
      echo 'MinIO buckets ready';
      "
    networks:
      - lakehouse-net

  # -----------------------------
  # Iceberg REST Catalog
  # -----------------------------
  iceberg-rest:
    image: tabulario/iceberg-rest:latest
    container_name: iceberg-rest
    environment:
      CATALOG_WAREHOUSE: s3://warehouse
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO

      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
      AWS_REGION: us-east-1

      CATALOG_S3_ENDPOINT: http://minio:9000
      # "__" becomes "-": this sets s3.path-style-access
      CATALOG_S3_PATH__STYLE__ACCESS: "true"

      CATALOG_CATALOG__IMPL: org.apache.iceberg.jdbc.JdbcCatalog
      CATALOG_URI: jdbc:postgresql://postgres:5432/iceberg_catalog
      CATALOG_JDBC_USER: iceberg
      CATALOG_JDBC_PASSWORD: iceberg
    ports:
      - "8181:8181"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - lakehouse-net
    # No healthcheck here: the image has no guaranteed curl/wget.
    # spark-thrift waits for http://iceberg-rest:8181/v1/config before starting.

  # -----------------------------
  # Cosmos / dbt / Airflow container (Development mode)
  # -----------------------------
  cosmos:
    build:
      context: ./cosmos
      dockerfile: Dockerfile
    container_name: lakehouse-cosmos
    environment:
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=sqlite:////app/airflow.db
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=false
      - AIRFLOW__CORE__FERNET_KEY=${FERNET_KEY:-46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqDDho=}
      - PYTHONPATH=/app
      - AWS_ACCESS_KEY_ID=minio
      - AWS_SECRET_ACCESS_KEY=minio123
      - AWS_REGION=us-east-1
      - DBT_PROFILES_DIR=/app/dbt/teratai
      - DBT_PROJECT_DIR=/app/dbt/teratai
      - SPARK_THRIFT_HOST=spark-thrift
      - SPARK_THRIFT_PORT=10000
    ports:
      - "8083:8080"  # Airflow webserver (you'll start manually)
      - "8001:8001"  # Optional additional port
    volumes:
      - ./cosmos:/app
      - ./cosmos/dags:/app/dags
      - ./cosmos/logs:/app/logs
      - ./cosmos/plugins:/app/plugins
      - /var/run/docker.sock:/var/run/docker.sock  # Optional for DockerOperator
    networks:
      - lakehouse-net
    depends_on:
      spark-thrift:
        condition: service_healthy
    restart: unless-stopped
    stdin_open: true
    tty: true

  # -----------------------------
  # Spark Master
  # -----------------------------
  spark-master:
    <<: *spark-build
    container_name: spark-master
    environment:
      SPARK_MODE: master
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - ./spark/spark-master/scripts/entrypoint.sh:/entrypoint.sh
      - spark-events:/tmp/spark-events
    networks:
      - lakehouse-net
    command: ["/entrypoint.sh", "master"]

  # -----------------------------
  # Spark Worker 1
  # -----------------------------
  spark-worker-1:
    <<: *spark-build
    container_name: spark-worker-1
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
    depends_on:
      - spark-master
    ports:
      - "8081:8081"
    volumes:
      - ./spark/spark-worker/scripts/entrypoint.sh:/entrypoint.sh
      - spark-events:/tmp/spark-events
    networks:
      - lakehouse-net
    command: ["/entrypoint.sh", "worker"]

  # -----------------------------
  # Spark Worker 2
  # -----------------------------
  spark-worker-2:
    <<: *spark-build
    container_name: spark-worker-2
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
    depends_on:
      - spark-master
    ports:
      - "8082:8081"
    volumes:
      - ./spark/spark-worker/scripts/entrypoint.sh:/entrypoint.sh
      - spark-events:/tmp/spark-events
    networks:
      - lakehouse-net
    command: ["/entrypoint.sh", "worker"]

  # -----------------------------
  # Spark Thrift Server (SQL endpoint)
  # -----------------------------
  spark-thrift:
    <<: *spark-build
    container_name: spark-thrift
    environment:
      SPARK_MODE: thrift
      SPARK_MASTER_URL: spark://spark-master:7077
      ICEBERG_REST_URL: http://iceberg-rest:8181
    restart: on-failure
    depends_on:
      - spark-master
      - spark-worker-1
      - spark-worker-2
      - iceberg-rest
    ports:
      - "10000:10000"
      - "4040:4040"
    volumes:
      - ./spark/spark-thrift/scripts/entrypoint.sh:/entrypoint.sh
      - spark-events:/tmp/spark-events
    networks:
      - lakehouse-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4040 > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    command: ["/entrypoint.sh", "thrift"]
